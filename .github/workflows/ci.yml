name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations are up to date with the schema
        run: |
          npm run db:check
          npx drizzle-kit generate --name ci-drift-check
          git diff --exit-code drizzle/ || (echo "::error::Schema changed without a migration. Run npm run db:generate and commit." && exit 1)
          test -z "$(git status --porcelain drizzle/)" || (git status drizzle/ && echo "::error::Uncommitted migration generated" && exit 1)
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Postgres + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pensieve
          POSTGRES_PASSWORD: pensieve
          POSTGRES_DB: pensieve
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pensieve"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pensieve:pensieve@localhost:5432/pensieve
      APP_PASSCODE: ci-passcode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run seed
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
